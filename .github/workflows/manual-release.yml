name: Manual Release Prep

# DEPRECATED: manual semver bumping is obsolete. Versions are now computed
# automatically by oneup (CalVer YY.MM.MICRO) from the date + prior git tags at
# release time — see build-and-release.yml. build.gradle stays versionless in
# git, so there is nothing to bump and no release PR to open here.
#
# This workflow is kept only as a thin manual trigger that runs the same
# oneup-based build-and-release flow directly.

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the GitHub Release immediately (disable to keep it as a draft)
        type: boolean
        default: true
      prerelease:
        description: Mark the GitHub Release as a pre-release
        type: boolean
        default: false

jobs:
  release:
    uses: ./.github/workflows/build-and-release.yml
    permissions:
      contents: write
    with:
      release_ref: master
      publish_release: ${{ inputs.publish_release }}
      prerelease: ${{ inputs.prerelease }}
    secrets: inherit
