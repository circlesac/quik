name: Auto-Update MMS configs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 1,4,7,10 *'

concurrency:
  group: auto-update-mms-configs
  cancel-in-progress: false

jobs:
  vvm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APKEEP_VERSION: 0.18.0
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 
      
      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-apkeep-${{ env.APKEEP_VERSION }}
          restore-keys: |
            ${{ runner.os }}-cargo-apkeep-
      
      - name: Install apkeep
        shell: bash
        run: |
          set -euo pipefail
          if command -v apkeep >/dev/null 2>&1; then
            installed_version=$(apkeep --version | awk '{print $2}')
            if [[ "$installed_version" == "$APKEEP_VERSION" ]]; then
              echo "apkeep ${APKEEP_VERSION} already installed."
              exit 0
            fi
          fi
          cargo install apkeep --locked --version "$APKEEP_VERSION"
        
      - name: Install APK tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip
          # apt ships an old apktool (2.7.0) that fails to decode newer Google APKs,
          # which is what made this job fail on roughly half the quarterly runs.
          # Install the latest official apktool release instead.
          apktool_jar=$(curl -sL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest \
            | grep browser_download_url | grep -o 'https://[^"]*\.jar')
          sudo curl -sL -o /usr/local/bin/apktool.jar "$apktool_jar"
          sudo curl -sL -o /usr/local/bin/apktool https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          apktool --version

      - name: Download Messaging APK 
        run: apkeep -a com.google.android.apps.messaging /home/runner/work/quik/quik

      - name: List files in directory
        run: ls /home/runner/work/quik/quik

      - name: Unzip the Messaging APK from XAPK
        shell: bash
        run: |
          if [ -f /home/runner/work/quik/quik/com.google.android.apps.messaging.xapk ]; then
            unzip /home/runner/work/quik/quik/com.google.android.apps.messaging.xapk -d /home/runner/work/quik/quik
          else
            echo "XAPK file not found, skipping unzip."
          fi

      - name: Decompile Messaging using apktool
        run: apktool d com.google.android.apps.messaging.apk -o dump
        
      - name: Copy MMS configs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          rm -rfv android-smsmms/src/main/res/xml-mcc*
          source_dirs=(dump/res/xml-mcc*)
          if [[ "${#source_dirs[@]}" -eq 0 ]]; then
            echo "No MMS config directories found in dump." >&2
            exit 1
          fi
          cp -rv "${source_dirs[@]}" android-smsmms/src/main/res/
          find android-smsmms/src/main/res/xml-mcc* -name '*_config_override.xml' -print -delete

      - name: Remove Duplicate MMS Config Files
        shell: bash
        run: |
          set -euo pipefail
          declare -A seen
          for file in android-smsmms/src/main/res/xml-mcc*/mms_config.xml; do
            dir_name=$(dirname "$file")
            if [[ "$dir_name" == *-mnc00 ]]; then
              # Check for corresponding directory without -mnc suffix
              base_dir=$(echo "$dir_name" | sed 's/-mnc00//')
              if [[ -d "$base_dir" ]]; then
                echo "Duplicate found for $base_dir and $dir_name"
                rm -rf "$base_dir"
              fi
            fi
          done

      - name: Resolve MNC leading-zero collisions
        shell: bash
        run: |
          set -euo pipefail
          # apktool 3.x emits both padded and unpadded MNC dirs (e.g. -mnc05 and -mnc5).
          # aapt normalises leading zeros, so both compile to the same MNC and the app
          # build fails with "Duplicate resources". Keep the most-padded form (Google's
          # canonical multi-digit MNC) per (mcc, numeric mnc) and drop the rest.
          cd android-smsmms/src/main/res
          declare -A best
          for d in xml-mcc*-mnc*; do
            [[ -d "$d" && "$d" =~ ^xml-(mcc[0-9]+)-mnc([0-9]+)$ ]] || continue
            mnc="${BASH_REMATCH[2]}"
            key="${BASH_REMATCH[1]}-$((10#$mnc))"
            cur="${best[$key]:-}"
            curmnc="${cur##*-mnc}"
            if [[ -z "$cur" || ${#mnc} -gt ${#curmnc} ]]; then
              best[$key]="$d"
            fi
          done
          for d in xml-mcc*-mnc*; do
            [[ -d "$d" && "$d" =~ ^xml-(mcc[0-9]+)-mnc([0-9]+)$ ]] || continue
            key="${BASH_REMATCH[1]}-$((10#${BASH_REMATCH[2]}))"
            if [[ "${best[$key]}" != "$d" ]]; then
              echo "collision: drop $d (keep ${best[$key]})"
              rm -rf "$d"
            fi
          done


      # The circlesac org blocks Actions from opening PRs, so commit the config
      # refresh straight to master (unprotected, mechanical vendored-config update).
      - name: Commit updated MMS configs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-smsmms/src/main/res/xml-mcc*
          if git diff --cached --quiet; then
            echo "MMS configs already up to date — nothing to commit."
          else
            git commit -m "Update MMS configs from com.google.android.apps.messaging.apk"
            git push origin HEAD:master
          fi
